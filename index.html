<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCET Mumbai</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Root Application Container -->
  <div id="app"></div>

  <!-- Global Modal Overlay (Announcements, Exam Detail, Syllabus Detail, Attendance Detail, Profile, Syllabus PDF) -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- Live Sync Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Modular JavaScript Files (Order matters: config -> data -> db -> portals -> app) -->
  <script src="js/firebase-config.js"></script>
  <script src="js/initial-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/student-portal.js"></script>
  <script src="js/teacher-portal.js"></script>
  <script src="js/admin-portal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
